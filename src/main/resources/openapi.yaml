openapi: 3.0.0
info:
  title: BlueStrongMountain API
  version: 1.0.0
  description: Swagger spec for BoardController and ProblemFilterController

servers:
  - url: http://localhost:8080

paths:

  ############################################################
  # AuthController
  ############################################################

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'

  /api/v1/auth/duplicate/username:
    get:
      tags: [Auth]
      summary: 닉네임 중복 체크
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 중복 여부 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameDuplicateResponse'

  /api/v1/auth/logout:
    post:
      summary: 로그아웃
      description: |
        refreshToken을 무효화하여 서버측 로그인을 종료합니다.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'


  ############################################################
  # UserController
  ############################################################

  /api/v1/users/{id}:
    get:
      tags: [User]
      summary: 유저 정보 조회
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 유저 정보 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'

    delete:
      tags: [User]
      summary: 회원 탈퇴
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'

  /api/v1/users/search:
    get:
      tags:
        [User]
      summary: Search users by keyword
      description: >
        username 또는 email에 대해 부분 일치 검색을 수행합니다.
        검색 결과로는 id, username, email만 반환합니다.
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
          description: 검색 키워드 (username 또는 email)
          example: "abc"
      responses:
        '200':
          description: Search result
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSimpleDto'
        '400':
          description: Invalid query parameter


  /api/v1/users/{id}/username:
    patch:
      tags: [User]
      summary: 닉네임 변경
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'


  /api/v1/users/{id}/password:
    patch:
      tags: [User]
      summary: 비밀번호 변경
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'



  ########################################################
  # GroupController APIs
  ########################################################

  /api/v1/groups:
    post:
      tags: [Group]
      summary: Create a new group
      parameters:
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreateRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

    get:
      tags: [Group]
      summary: Get my groups or search my groups
      parameters:
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
        - in: query
          name: name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSummaryResponse'



  /api/v1/groups/{groupId}:
    patch:
      tags: [Group]
      summary: Update group information
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupUpdateRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

  /api/v1/groups/{groupId}/detail:
    get:
      tags: [Group]
      summary: "그룹 상세 조회"
      description: "요청자가 속한 그룹의 상세 정보를 조회합니다."
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
          description: "조회할 그룹 ID"

        - name: requesterId
          in: query
          required: true
          schema:
            type: integer
          description: "요청자의 사용자 ID"

      responses:
        '200':
          description: "그룹 상세 정보 반환"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetailDto'

        '404':
          description: "그룹을 찾을 수 없음"
        '403':
          description: "그룹 접근 권한 없음"


  /api/v1/groups/{groupId}/owner:
    patch:
      tags: [Group]
      summary: Transfer group ownership
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerChangeRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'



  /api/v1/groups/{groupId}/managers:
    post:
      tags: [Group]
      summary: Add managers to group (bulk)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdsRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

    delete:
      tags: [Group]
      summary: Remove managers (bulk)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerIdsRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'



  /api/v1/groups/{groupId}/members:
    post:
      tags: [Group]
      summary: Add members to group (bulk)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserIdsRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'

    delete:
      tags: [Group]
      summary: Remove members (bulk)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
        - in: query
          name: userIds
          required: true
          schema:
            type: array
            items:
              type: integer
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'



  /api/v1/groups/{groupId}/members/me:
    delete:
      tags: [Group]
      summary: Leave group (self)
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicResponse'


  ########################################################
  # BoardController APIs
  ########################################################

  /api/v1/groups/{groupId}/boards:
    post:
      tags:
        - Board
      summary: Create a board
      parameters:
        - in: path
          name: groupId
          schema:
            type: integer
          required: true
        - in: query
          name: requesterId
          schema:
            type: integer
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardCreateRequest'
            example:
              title: "그래프 심화 세션"
              content: "플로이드-워셜 정리 및 최소 컷 문제 풀이"
              startTime: "2025-01-01T10:00:00"
              endTime: "2025-01-01T12:00:00"
              problemIds: [1000, 1409]
      responses:
        '200':
          description: Created board ID
          content:
            application/json:
              schema:
                type: integer
              example: 42

    get:
      tags:
        - Board
      summary: Search boards with conditions
      description: >
        조건에 따라 그룹 내 게시판 목록을 조회합니다.
        각 게시판에는 포함된 문제 개수가 함께 반환됩니다.
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: title
          schema:
            type: string
        - in: query
          name: writerId
          schema:
            type: integer
            format: int64
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of boards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardResponse'
              example:
                - boardId: 1
                  title: "DP 세션"
                  endTime: "2025-01-01T10:00:00"
                  problemsCount: 5
                - boardId: 2
                  title: "DP 세션2"
                  endTime: "2025-01-03T15:00:00"
                  problemsCount: 8

  /api/v1/groups/{groupId}/boards/{boardId}:
    get:
      tags:
        - Board
      summary: Get board detail
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: path
          name: boardId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Board detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardDetailResponse'
              example:
                boardId: 42
                groupId: 10
                writerId: 3
                title: "그래프 심화 세션"
                content: "플로이드-워셜과 최소 컷"
                startTime: "2025-01-01T10:00:00"
                endTime: "2025-01-01T12:00:00"
                problems:
                  - id: 1409
                    title: "행렬"
                    difficulty: 12
                  - id: 1508
                    title: "레이스"
                    difficulty: 13

    patch:
      tags:
        - Board
      summary: Update board
      description: 보드의 제목, 종료 시간, 문제 목록을 수정합니다.
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
            format: int64
        - in: path
          name: boardId
          required: true
          schema:
            type: integer
            format: int64
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
            format: int64

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardUpdateRequest'
            example:
              title: "그래프 심화 세션(수정)"
              endTime: "2025-01-01T18:00:00"
              problemIds:
                - 1001
                - 1002
                - 1003

      responses:
        '204':
          description: Board updated successfully


    delete:
      tags:
        - Board
      summary: Delete board
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: path
          name: boardId
          required: true
          schema:
            type: integer
        - in: query
          name: requesterId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: string
              example: "deleted"

  /api/v1/groups/{groupId}/boards/{boardId}/userStatus:
    get:
      tags:
        - Board
      summary: 보드 유저 풀이 현황 조회
      description: 보드에 포함된 문제별, 유저별 풀이 현황을 조회합니다.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: boardId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: requesterId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 보드 유저 풀이 현황 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardProgressResponse'


  /api/v1/groups/{groupId}/boards/{boardId}/problems:
    get:
      tags:
        - Board
      summary: Get problems inside a board
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            type: integer
        - in: path
          name: boardId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Problems belonging to board
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
              example: [1000, 1409, 1508]

  ########################################################
  # ProblemFilterController APIs
  ########################################################

  /api/v1/groups/{groupId}/problems/filter:
    get:
      tags:
        - ProblemFilter
      summary: Filter problems
      description: >
        Filters problems using query parameters.
        All parameters are optional.  
        Mode: "normal" or "review"
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: integer

        - name: mode
          in: query
          required: false
          schema:
            type: string
          description: normal / review

        - name: problemIds
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
          description: Multiple IDs can be passed, e.g. ?problemIds=1&problemIds=2

        - name: difficultyFrom
          in: query
          required: false
          schema:
            type: integer

        - name: difficultyTo
          in: query
          required: false
          schema:
            type: integer

        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          description: ?tags=dp&tags=graph

        - name: minSolvers
          in: query
          required: false
          schema:
            type: integer

        - name: unsolved
          in: query
          required: false
          schema:
            type: boolean

      responses:
        '200':
          description: Filtered list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilteredProblemsResponse'
              example:
                success: true
                problems:
                  - id: 1409
                    title: "피보나치 수 1"
                    difficulty: 10
                    tags: ["DP"]
                    acceptedUserCount: 1200
                    registeredAt: "2024-11-01"
                    reviewCount: 2
  ########################################################
  # UserSolutionController APIs
  ########################################################
  /api/v1/user-solutions:
    post:
      summary: Save a user’s solution record
      description: Store that a user solved a specific problem at a specific time.
      tags:
        - UserSolution 백엔드용
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSolutionCreateRequest'
            example:
              userId: 1
              problemId: 1003
      responses:
        '200':
          description: Successfully saved user solution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSolutionResponse'
              example:
                userId: 1
                problemId: 1003
                solvedAt: "2025-01-15T14:30:15"

  /api/v1/user-solutions/user/{userId}:
    get:
      summary: Get all solved problems by userId
      description: Returns a list of problem IDs solved by the given user.
      tags:
        - UserSolution 백엔드용
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of solved problem IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
              example: [1003, 1005, 1409]

  /api/v1/user-solutions/problem/{problemId}:
    get:
      summary: Get all users who solved a specific problem
      tags:
        - UserSolution 백엔드용
      parameters:
        - name: problemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of user solution records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSolutionResponse'
              example:
                - userId: 1
                  problemId: 1003
                  solvedAt: "2025-01-15T14:20:00"
                - userId: 2
                  problemId: 1003
                  solvedAt: "2025-01-16T10:11:22"

  /api/v1/user-solutions/check:
    get:
      summary: Check whether a user solved a specific problem
      tags:
        - UserSolution 백엔드용
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
        - name: problemId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: True if solved, false otherwise
          content:
            application/json:
              schema:
                type: boolean
              example: true

  /api/test/solvedac/sync:
    post:
      tags:
        - SolvedAc (백엔드용 Test)
      summary: solved.ac 문제 풀이 동기화 테스트
      description: |
        solved.ac 외부 API를 호출하여 특정 사용자의 풀이 문제 목록을 조회합니다.
        - **테스트 목적 API**
        - DB 저장 로직 없이 콘솔 출력으로 결과를 확인합니다.
      parameters:
        - in: query
          name: userId
          required: true
          description: 내부 User ID (Baekjoon handle이 저장된 사용자)
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: solved.ac 동기화 호출 성공
        '400':
          description: 잘못된 요청 (userId 누락 등)
        '404':
          description: 사용자 정보를 찾을 수 없음
        '500':
          description: solved.ac API 호출 중 서버 오류

  /api/test/solvedac/solved:
    get:
      tags:
        - SolvedAc (백엔드용 Test)
      summary: 유저가 푼 문제 ID 목록 조회
      description: 특정 유저가 해결한 문제들의 ID 목록을 반환한다
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: integer
            format: int64
          description: 사용자 ID
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
                  format: int64
              example:
                - 1000
                - 2557
                - 10026
        '400':
          description: 잘못된 요청
        '500':
          description: 서버 오류


components:
  schemas:
    ############################################################
    # BaseResponse
    ############################################################
    BaseResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
      ############################################################
    # Auth DTOs
    ############################################################

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: "12345678"

